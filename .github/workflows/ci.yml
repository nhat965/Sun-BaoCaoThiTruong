name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: market_intelligence_test
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_intelligence_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://market:market_test_only@localhost:5432/market_intelligence_test
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend and audit tooling
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check app tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Verify migrations on PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Benchmark isolated PostgreSQL analytics fixture
        run: python scripts/benchmark_market_analytics_postgres.py --database-url "$DATABASE_URL" --runs 3
      - name: Audit Python dependencies
        run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
